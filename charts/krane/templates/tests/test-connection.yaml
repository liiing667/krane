apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "krane.fullname" . }}-test-connection"
  labels:
    {{- include "krane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--header'
        - 'Authorization: Bearer $(KRANE_DASHBOARD_TOKEN)'
        - '{{ include "krane.fullname" . }}:{{ .Values.service.port }}'
      env:
        - name: KRANE_DASHBOARD_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.params.dashboardTokenSecret.name | quote }}
              key: {{ .Values.params.dashboardTokenSecret.key | quote }}
  restartPolicy: Never
