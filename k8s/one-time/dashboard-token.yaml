# The dashboard refuses to start without KRANE_DASHBOARD_TOKEN. Do not commit a
# real value: create this secret out of band with a long random token instead,
# for example
#
#   kubectl create secret generic krane-dashboard \
#     --namespace krane \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# This placeholder only documents the expected shape and is not safe to deploy.
---
apiVersion: v1
kind: Secret
metadata:
  name: krane-dashboard
  namespace: krane
type: Opaque
stringData:
  token: REPLACE-BEFORE-APPLY
